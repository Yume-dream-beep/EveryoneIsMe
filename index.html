// その分野が弱かった原因の軸を、影響の大きい順に返す
function collapseCauses(k,a){
  const C=COLLAPSE[k], res=[];
  for(const ax in C.w){
    const w=C.w[ax];
    const dir = w>0 ? "lo" : "hi";            // 弱点になる向き
    const gap = w>0 ? (100-a[ax]) : a[ax];     // どれだけその向きに寄っているか
    if(!C.cause[ax]||!C.cause[ax][dir]) continue;
    res.push({ax,dir,loss:Math.abs(w)*gap,val:a[ax],lines:C.cause[ax][dir]});
  }
  res.sort((x,y)=>y.loss-x.loss);
  // 実際に弱点側に寄っている性格だけを原因とする(なければ一番影響の大きいもの)
  const real=res.filter(c=>c.dir==="lo"?c.val<50:c.val>50);
  return real.length?real:res.slice(0,1);
}

const $=id=>document.getElementById(id);

$("startBtn").onclick=()=>{ idx=0; answers=[]; show("quiz"); renderQ(); };

function show(id){ ["start","quiz","result"].forEach(s=>$(s).classList.toggle("hidden",s!==id)); window.scrollTo(0,0); }

function renderQ(){
  const Q=QUESTIONS[idx];
  $("qnum").textContent=`Q${idx+1} / ${QUESTIONS.length}`;
  $("bar").style.width=(idx/QUESTIONS.length*100)+"%";
  const box=$("qbox");
  box.innerHTML=`<div class="card fade"><div class="qtext">${Q.q}</div>${Q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o[0]}</button>`).join("")}</div>`
    + (idx>0?`<button class="btn ghost" id="backBtn" style="margin-top:6px">← ひとつ戻る</button>`:"");
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    answers[idx]=+b.dataset.i; idx++;
    if(idx<QUESTIONS.length) renderQ(); else finish();
  });
  if(idx>0) $("backBtn").onclick=()=>{ idx--; renderQ(); };
}

function calcAxes(){
  const a={c:50,p:50,r:50,s:50,d:50,q:50};
  answers.forEach((ai,qi)=>{ const eff=QUESTIONS[qi].o[ai][1]; for(const k in eff) a[k]+=eff[k]; });
  for(const k in a) a[k]=Math.max(3,Math.min(97,a[k]));
  return a;
}
const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));
function sectorScores(a){ const o={}; SECTORS.forEach(s=>o[s.k]=clamp(s.f(a))); return o; }
function lifespan(sc){
  const m=Math.min(...SECTORS.filter(s=>s.crit).map(s=>sc[s.k]));
  if(m>=64) return Infinity;
  return Math.max(3,Math.round(3*Math.pow(1.095,m)));
}
const fmtLife=l=>l===Infinity?"1000年以上":`${l}年`;

function typeName(a){
  const ks=Object.keys(a).sort((x,y)=>Math.abs(a[y]-50)-Math.abs(a[x]-50));
  const lab=k=>a[k]>=50?AXES[k].hi:AXES[k].lo;
  if(Math.abs(a[ks[0]]-50)<10) return "「バランス型」の平均的ニンゲン";
  return `「${lab(ks[0])}」×「${lab(ks[1])}」タイプ`;
}

function buildTimeline(a,sc,life){
  const ev=[];
  SECTORS.forEach(s=>{
    const v=sc[s.k];
    if(v<40){
      let tx=s.lo;
      if(s.k==="pol") tx = a.s<45 ? "会議で誰も発言しない。法律が1本も決まらない。" : "会議で誰も譲らない。国会が10年間ずっと延長戦。";
      ev.push({y:2+Math.round(v/2.5),g:"bad",tx,name:s.name});
    } else if(v>=70){
      ev.push({y:1+Math.round((100-v)/5),g:"good",tx:s.hi,name:s.name});
    }
  });
  QUIRKS.forEach(q=>{ if(q.t(a)) ev.push({y:q.y,g:q.g,tx:q.tx}); });
  let list=ev.filter(e=>life===Infinity||e.y<life).sort((x,y)=>x.y-y.y);
  if(!list.some(e=>e.g==="bad")){
    const w=SECTORS.filter(x=>x.lo).sort((x,y)=>sc[x.k]-sc[y.k])[0];
    const yy=Math.min(life===Infinity?60:life-1, 20+sc[w.k]);
    list.push({y:yy,g:"bad",tx:"少しずつ問題が表に出てくる。"+w.lo});
  }
  if(!list.some(e=>e.g==="good")){
    const b=SECTORS.slice().sort((x,y)=>sc[y.k]-sc[x.k])[0];
    if(sc[b.k]>=50) list.push({y:Math.max(1,Math.round((100-sc[b.k])/4)),g:"good",tx:"「"+b.name+"」がこの社会の強み。"+b.hi.replace(/。$/,"")+"…とまではいかないが、かなりいい線。"});
  }
  if(list.length<3) list.push({y:10,g:"mid",tx:"特に大きな事件もなく、まずまず平和な日々が続く。"});
  list.sort((x,y)=>x.y-y.y);
  if(life!==Infinity){
    const worst=SECTORS.filter(s=>s.crit).sort((x,y)=>sc[x.k]-sc[y.k])[0];
    const C=COLLAPSE[worst.k], causes=collapseCauses(worst.k,a);
    // 同じ分野の「低い」イベントは崩壊ストーリーと重なるので外す
    list=list.filter(e=>e.name!==worst.name);
    const yr=f=>Math.max(1,Math.round(life*f));
    const story=[{y:yr(.3),g:"bad",tx:C.s1}];
    if(causes[0]) story.push({y:yr(.55),g:"bad",tx:causes[0].lines[0]});
    if(causes[1]) story.push({y:yr(.75),g:"bad",tx:causes[1].lines[0]});
    if(causes[0]) story.push({y:yr(.9),g:"bad",tx:causes[0].lines[1]});
    // 年が重ならないよう少しずらす
    let last=0; story.forEach(e=>{ if(e.y<=last) e.y=last+1; last=e.y; });
    list=list.concat(story.filter(e=>e.y<life)).sort((x,y)=>x.y-y.y);
    list.push({y:life,g:"end",tx:C.end});
  } else {
    list.push({y:"1000",g:"good",tx:"社会はしぶとく続いていく。たまにケンカしつつも、わりと平和。"});
  }
  return list;
}

function complements(a,sc){
  // 「軸2つを極端にした人」を全パターン試し、社会の3割に混ぜたら一番よくなるタイプを選ぶ
  const keys=Object.keys(a), cands=[];
  const critMin=x=>Math.min(...SECTORS.filter(s=>s.crit).map(s=>x[s.k]));
  const total=x=>SECTORS.reduce((t,s)=>t+x[s.k],0);
  for(let i=0;i<keys.length;i++)for(let j=0;j<keys.length;j++){ if(i===j) continue;
    for(const di of ["hi","lo"]) for(const dj of ["hi","lo"]){
      const k1=keys[i],k2=keys[j];
      const v1=di==="hi"?90:10, v2=dj==="hi"?90:10;
      // 自分と同じ方向の人は「違うタイプ」ではないので除外
      if(Math.abs(a[k1]-v1)<30||Math.abs(a[k2]-v2)<30) continue;
      const prof={...a,[k1]:v1,[k2]:v2}; // 他の軸はあなたと同じ
      const mix={}; for(const k in a) mix[k]=a[k]*.7+prof[k]*.3;
      const msc=sectorScores(mix), life=lifespan(msc);
      const score=(life===Infinity?5000:life)*10 + critMin(msc)*3 + (total(msc)-total(sc));
      cands.push({k1,di,k2,dj,msc,life,score});
    }
  }
  cands.sort((x,y)=>y.score-x.score);
  const out=[], usedPrimary=new Set(), usedPair=new Set();
  for(const c of cands){
    if(out.length>=3) break;
    const pair=[c.k1+c.di,c.k2+c.dj].sort().join("|");
    if(usedPair.has(pair)||usedPrimary.has(c.k1+c.di)) continue;
    const ups=SECTORS.map(x=>({name:x.name,from:sc[x.k],to:c.msc[x.k]})).filter(x=>x.to-x.from>=4).sort((x,y)=>(y.to-y.from)-(x.to-x.from)).slice(0,3);
    if(!ups.length) continue;
    usedPair.add(pair); usedPrimary.add(c.k1+c.di);
    out.push({
      name:`「${AXES[c.k1][c.di]}」×「${AXES[c.k2][c.dj]}」タイプ`,
      desc:HELPER[c.k1][c.di]+"。そして、"+HELPER[c.k2][c.dj]+"人。",
      life:c.life, ups
    });
  }
  return out;
}

let shareText="";
function finish(){
  $("bar").style.width="100%";
  const a=calcAxes(), sc=sectorScores(a), life=lifespan(sc), tn=typeName(a);
  const tl=buildTimeline(a,sc,life), comps=complements(a,sc);
  let causeCard="";
  if(life!==Infinity){
    const worst=SECTORS.filter(s=>s.crit).sort((x,y)=>sc[x.k]-sc[y.k])[0];
    const cs=collapseCauses(worst.k,a).slice(0,3);
    causeCard=`<h2>💥 なぜ「${worst.name}」で崩壊した？</h2>
    <div class="card">
      <p class="sub" style="margin-top:0">「${worst.name}」のスコアは <b style="color:var(--bad)">${sc[worst.k]}</b>。社会を支える分野の中で一番低く、ここから崩れました。原因になった性格はこちら：</p>
      ${cs.map(c=>`<div class="cause"><div class="cause-h">${AXES[c.ax].name}が${c.dir==="hi"?"高い":"低い"}（${c.val}）</div><div class="cause-t">→ ${c.lines[0]}</div></div>`).join("")}
    </div>`;
  }
  const color=v=>v<40?"var(--bad)":v<70?"var(--mid)":"var(--good)";

  const html=`
  <div class="fade">
    <span class="tag">シミュレーション結果</span>
    <div class="card">
      <p class="sub" style="text-align:center;margin:0">あなたは…</p>
      <div class="typename">${tn}</div>
      <div class="axes" style="margin-top:12px">
        ${Object.keys(AXES).map(k=>`<div class="row"><span>${AXES[k].L}</span><div class="track"><div class="dot" style="left:${a[k]}%"></div></div><span>${AXES[k].R}</span></div>`).join("")}
      </div>
    </div>

    <div class="card">
      <p class="sub" style="text-align:center;margin:0">全人類があなただった場合、社会が続く期間</p>
      <div class="lifespan"><div class="num ${life===Infinity?"forever":""}">${fmtLife(life)}</div></div>
      <p class="sub" style="text-align:center">${life===Infinity?"意外と回る！ ただし、ところどころ問題も…":life<30?"かなり早めに限界がきます…":life<200?"しばらくは回るけど、どこかで無理が出ます":"長持ちするけど、永遠ではありません"}</p>
    </div>

    <h2>📊 社会の各分野</h2>
    <div class="card bars">
      ${SECTORS.map(s=>`<div class="row"><span>${s.name}${s.crit?"":""}</span><div class="track"><div class="fill" style="width:0;background:${color(sc[s.k])}" data-w="${sc[s.k]}"></div></div><span class="val">${sc[s.k]}</span></div>`).join("")}
    </div>

    ${causeCard}
    <h2>📜 わたしだらけの社会・年表</h2>
    <div class="card"><div class="timeline">
      ${tl.map(e=>`<div class="ev ${e.g}"><div class="yr">${e.y===1?"1年目":e.y+"年目"}</div><div class="tx">${e.tx}</div></div>`).join("")}
    </div></div>

    <h2>🤝 あなたとは違う、こんなタイプの人がいたら…</h2>
    <p class="sub">社会の3割がこのタイプだったら、社会は回っていたかも…</p>
    ${comps.map(c=>`
      <div class="card comp">
        <div class="ctitle">${c.name}</div>
        <p style="font-size:15px">${c.desc}</p>
        <div class="change">社会が続く期間：${fmtLife(life)} <span class="arrow">→</span> <b>${fmtLife(c.life)}</b></div>
        <div class="chips">${c.ups.map(u=>`<span class="chip">${u.name} ${u.from}→<b style="color:var(--good)">${u.to}</b></span>`).join("")}</div>
      </div>`).join("")}

    <div class="card" style="text-align:center">
      <p style="margin:0">あなたの「苦手」は、誰かの「得意」。<br>社会はいろんな人がいるから回っている。</p>
    </div>

    <button class="btn" id="copyBtn">結果をコピーしてシェア</button>
    <div style="height:10px"></div>
    <button class="btn ghost" id="retryBtn">もう一度やる</button>
  </div>`;
  $("result").innerHTML=html;
  show("result");
  requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll(".fill").forEach(f=>f.style.width=f.dataset.w+"%"),50));

  const bad=tl.find(e=>e.g==="bad"||e.g==="end");
  shareText=`【全人類わたし化シミュレーター】\n私は${tn}\n全人類が私だったら、社会は${fmtLife(life)}続く！\n${bad?"起きた事件:"+bad.tx+"\n":""}${comps[0]?"足りなかったのは… "+comps[0].name:""}`;
  $("copyBtn").onclick=async()=>{
    try{ await navigator.clipboard.writeText(shareText); toast("コピーしました！"); }
    catch(e){ toast("コピーできませんでした"); }
  };
  $("retryBtn").onclick=()=>show("start");
}

function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }
</script>
